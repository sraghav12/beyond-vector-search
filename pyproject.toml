[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-vector-search"
version = "0.1.0"
description = "A reproducible SEC filing retrieval evaluation benchmark"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["pipelines*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
